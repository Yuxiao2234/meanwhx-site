<article class="note-page">
  <header class="note-hero shell shell--reading">
    <a class="back-link" href="/notes/">← Notes</a>
    <p class="kicker">{{type}} · {{date}}</p>
    <h1>{{title}}</h1>
    <p class="note-byline">By {{author}}</p>
    <div class="tag-list" aria-label="Topics">{{tags}}</div>
  </header>
  <div class="note-body shell shell--reading prose">
    {{body}}
  </div>
</article>
